<body><div style = "accent-color: #E8E085; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh;"><div><div><canvas id="waveform" width="600" height="200" style="border: 4px solid #E8E085;"></canvas></div><h1>TinySynth</h1><h2>Current pitch: <span id="current-pitch"></span> Hz</h2><p>Use the buttons to start and stop the sound, and the slider to change the pitch.</p></div><div class="controls"><button onclick="randomPitch()">Random Pitch</button><button onclick="startSound()">Start sound</button><button onclick="stopSound()">Stop sound</button></div><div class="slider"><input id="pitch" type="range" min="100" max="1000" value="440" oninput="changePitch()"><label for="pitch">Pitch</label></div><div class="slider"><input id="volume" type="range" min="0" max="1" step="0.01" value="0.5" oninput="gainNode.gain.value = this.value"><label for="volume">Volume</label></div></div><style>body{background:#030164;color:#E8E085;font-family:sans-serif}</style><script>const e=new AudioContext;document.querySelector("#current-pitch").innerHTML=document.querySelector("#pitch").value,document.querySelector("#volume");const t=e.createGain();t.gain.value=.5,t.connect(e.destination);const n=document.querySelector("#waveform").getContext("2d");n.fillStyle="#363199",n.fillRect(0,0,1e3,1e3);</script></body>
