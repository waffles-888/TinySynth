<body><div><div style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh;"><h1>TinySynth</h1><h2>Current pitch: <span id="current-pitch"></span> Hz</h2><p>Use the buttons to start and stop the sound, and the slider to change the pitch.</p></div><div class="controls"><button onclick="startSound()">Start sound</button><button onclick="stopSound()">Stop sound</button></div><div class="slider"><input id="pitch" type="range" min="100" max="1000" value="440" oninput="changePitch(), document.querySelector('#current-pitch').innerHTML = this.value"></div></div><style>body{background:#030164;color:#E8E085;font-family:sans-serif}</style><script>new AudioContext,document.querySelector("#current-pitch").innerHTML=document.querySelector("#pitch").value;</script></body>
