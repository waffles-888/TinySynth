<body><div style = "accent-color: #E8E085; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh;"><div><div><canvas id="waveform" width="600" height="200" style="border: 4px solid #E8E085;"></canvas></div><h1>TinySynth</h1><h2>Current pitch: <span id="current-pitch"></span> Hz</h2></div><div class="controls"><button onclick="randomPitch()">Random Pitch</button><button onclick="startSound()">Start sound</button><button onclick="stopSound()">Stop sound</button><select style="background: #E8E085;" id="form-select" onchange="changeWave()"><option value="square">Square</option><option value="sine">Sine</option><option value="triangle">Triangle</option><option value="sawtooth">Sawtooth</option></select></div><div class="slider"><input id="pitch" type="range" min="100" max="1000" value="440" oninput="changePitch()"><label for="pitch">Pitch</label></div><div class="slider"><input id="volume" type="range" min="0" max="1" step="0.01" value="0.5" oninput="gainNode.gain.value = this.value"><label for="volume">Volume</label></div></div><style>body{background:#030164;color:#E8E085;font-family:sans-serif}</style><script>const audioContext=new AudioContext;let oscillator;function startSound(){if(oscillator)return;oscillator=audioContext.createOscillator();const t=document.querySelector("#form-select").value;oscillator.type=t,oscillator.frequency.setValueAtTime(document.querySelector("#pitch").value,audioContext.currentTime),oscillator.connect(gainNode),oscillator.start()}function stopSound(){oscillator.stop(),oscillator.disconnect(),oscillator=null}function changePitch(){const t=document.querySelector("#pitch").value;document.querySelector("#current-pitch").innerHTML=t,oscillator&&oscillator.frequency.setValueAtTime(t,audioContext.currentTime)}function changeWave(){const t=document.querySelector("#form-select").value;oscillator&&(oscillator.type=t)}const analyser=audioContext.createAnalyser();analyser.connect(audioContext.destination);const gainNode=audioContext.createGain();function randomPitch(){const t=Math.round(900*Math.random()+100);document.querySelector("#pitch").value=t,changePitch()}gainNode.gain.value=.5,gainNode.connect(analyser);const canvas=document.querySelector("#waveform"),canvasCtx=canvas.getContext("2d");analyser.fftSize=2048;const bufferLength=analyser.frequencyBinCount,dataArray=new Uint8Array(bufferLength);function drawWave(){requestAnimationFrame(drawWave),analyser.getByteTimeDomainData(dataArray),canvasCtx.fillStyle="#363199",canvasCtx.fillRect(0,0,1e3,1e3),canvasCtx.strokeStyle="#E8E085",canvasCtx.lineWidth=2,canvasCtx.beginPath();for(let t=0;t<bufferLength;t++){const e=t/bufferLength*canvas.width,a=dataArray[t]/128*(canvas.height/2);0===t?canvasCtx.moveTo(e,a):canvasCtx.lineTo(e,a)}canvasCtx.stroke()}drawWave();</script></body>
