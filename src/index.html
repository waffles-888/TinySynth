<body>
<div style = "accent-color: #E8E085; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh;">
  <div>
    <div>
      <canvas id="waveform" width="600" height="200" style="border: 4px solid #E8E085;">

      </canvas>
    </div>
    <h1>TinySynth</h1>
    <h2>Current pitch: <span id="current-pitch"></span> Hz</h2>
  </div>
  <div class="controls">
  <button onclick="randomPitch()">Random Pitch</button>
  <button onclick="startSound()">Start sound</button>
  <button onclick="stopSound()">Stop sound</button>
  <select id="form-select" onchange="changeWave()">
    <option value="square">Square</option>
    <option value="sine">Sine</option>
    <option value="triangle">Triangle</option>
    <option value="sawtooth">Sawtooth</option>
  </select>
</div>
<div class="slider">
  <input id="pitch" type="range" min="100" max="1000" value="440" oninput="changePitch()">
  <label for="pitch">Pitch</label>
  </div>
  <div class="slider">
  <input id="volume" type="range" min="0" max="1" step="0.01" value="0.5" oninput="gainNode.gain.value = this.value">
  <label for="volume">Volume</label>
  </div>
</div>
  <style>
    body { background: #030164; color: #E8E085; font-family: sans-serif; }
  </style>

  <script>
    const audioContext = new AudioContext();
    let oscillator;

    // Oscillator start
    function startSound() {
        if (oscillator) {
            return;
        }
    oscillator = audioContext.createOscillator();
    const wave = document.querySelector('#form-select').value;
    oscillator.type = wave;
    oscillator.frequency.setValueAtTime(document.querySelector('#pitch').value, audioContext.currentTime);
    oscillator.connect(gainNode);
    oscillator.start();
    }

    // Oscillator stop
    function stopSound() {
      oscillator.stop();
        oscillator.disconnect();
        oscillator = null;
    }

    // Change pitch
    function changePitch() {
      const pitch = document.querySelector('#pitch').value;
      document.querySelector('#current-pitch').innerHTML = pitch;
      if (!oscillator) {
        return;
      }
        oscillator.frequency.setValueAtTime(pitch, audioContext.currentTime);
      }

      // Change waveform
      function changeWave() {
        const wave = document.querySelector('#form-select').value;
        if (!oscillator) {
          return;
        }
        oscillator.type = wave;
      }

      //waveform sound
      const analyser = audioContext.createAnalyser();
      analyser.connect(audioContext.destination);

      // volume
      const gainNode = audioContext.createGain();
      gainNode.gain.value = 0.5;
      gainNode.connect(analyser);

      // Random pitch
      function randomPitch() {
      const newPitch = Math.round(Math.random() * (1000 - 100) + 100);
      document.querySelector('#pitch').value = newPitch;
      changePitch();
      }

      // Waveform visualization
      const canvas = document.querySelector('#waveform');
      const canvasCtx = canvas.getContext('2d');
      
      analyser.fftSize = 2048;
      const bufferLength = analyser.frequencyBinCount;
      const dataArray = new Uint8Array(bufferLength);

      function drawWave() {
        requestAnimationFrame(drawWave);
        analyser.getByteTimeDomainData(dataArray);
        canvasCtx.fillStyle = '#363199';
        canvasCtx.fillRect(0, 0, 1000, 1000);
        canvasCtx.strokeStyle = '#E8E085';
        canvasCtx.lineWidth = 2;
        canvasCtx.beginPath();
        for (let i = 0; i < bufferLength; i++) {
          const x = (i / bufferLength) * canvas.width;
          const y = (dataArray[i] / 128.0) * (canvas.height / 2);
          if (i === 0) {
            canvasCtx.moveTo(x, y);
          } else {
            canvasCtx.lineTo(x, y);
          }
        }
        canvasCtx.stroke();
      }
      drawWave();

  </script>

</body>
